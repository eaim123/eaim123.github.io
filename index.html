<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Security Breach Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: black;
        color: #00ff9f;
        font-family: "Courier New", monospace;
        overflow: hidden;
    }

    .center {
        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    h1 {
        color: red;
        font-size: 2.5em;
    }

    .terminal {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 40%;
        background: black;
        border-top: 1px solid #00ff9f;
        padding: 10px;
        overflow-y: auto;
        font-size: 0.9em;
    }

    .file {
        position: absolute;
        color: #00ff9f;
        font-size: 12px;
        animation: move 5s linear infinite;
    }

    @keyframes move {
        from {
            transform: translateX(-100px);
        }
        to {
            transform: translateX(110vw);
        }
    }

    .encrypt {
        color: red;
        font-weight: bold;
    }

    .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .ransom {
        color: red;
        font-size: 1.5em;
    }
</style>
</head>

<body>

<div class="center">
    <h1>⚠ ACCESO NO AUTORIZADO ⚠</h1>
    <p>Si esto hubiera sido un ataque real… ya estarías comprometido.</p>
</div>

<div class="terminal" id="terminal"></div>

<div class="overlay" id="overlay">
    <div class="ransom">
        <h2>TUS ARCHIVOS HAN SIDO ENCRIPTADOS</h2>
        <p>Todos tus datos han sido comprometidos.</p>
        <p>Para recuperarlos, necesitas una clave privada.</p>
        <p>Tiempo restante: <span id="timer">60</span> segundos</p>
    </div>
</div>

<script>
    const terminal = document.getElementById("terminal");
    const overlay = document.getElementById("overlay");
    const timer = document.getElementById("timer");

    const messages = [
        "Iniciando conexión remota...",
        "Bypass de firewall... OK",
        "Escaneando red interna...",
        "Detectando vulnerabilidades...",
        "Acceso a archivos...",
        "Extrayendo datos sensibles...",
        "Iniciando proceso de encriptación..."
    ];

    let i = 0;

    function typeLine() {
        if (i < messages.length) {
            let line = document.createElement("div");
            line.textContent = "> " + messages[i];
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
            i++;
            setTimeout(typeLine, 1000);
        } else {
            startEncryption();
        }
    }

    function startEncryption() {
        let count = 0;

        let encryptInterval = setInterval(() => {
            let line = document.createElement("div");
            line.innerHTML = "> <span class='encrypt'>ENCRIPTANDO:</span> archivo_" + count + ".dat";
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
            count++;

            createFile();

            if (count > 20) {
                clearInterval(encryptInterval);
                showRansom();
            }
        }, 200);
    }

    function createFile() {
        let file = document.createElement("div");
        file.className = "file";
        file.style.top = Math.random() * 100 + "vh";
        file.textContent = "archivo.dat";
        document.body.appendChild(file);

        setTimeout(() => {
            file.remove();
        }, 5000);
    }

    function showRansom() {
        overlay.style.display = "flex";

        let timeLeft = 60;

        let countdown = setInterval(() => {
            timeLeft--;
            timer.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timer.textContent = "PERDIDO";
            }
        }, 1000);
    }

    typeLine();
</script>

</body>
</html>
